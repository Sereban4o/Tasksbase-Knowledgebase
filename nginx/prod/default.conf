server {
    listen 80;
    server_name _;

    # Backend root (used only as a reference for the FastCGI snippet)
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 600m;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/xml
        image/svg+xml;

    # ── Laravel API / backend routes (^~ prevents the SPA asset regex) ──────
    location ^~ /api/          { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /sanctum/      { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /broadcasting/ { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /storage/      { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /docs          { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /up            { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /_ignition     { include /etc/nginx/snippets/laravel.conf; }
    location ^~ /admin         { include /etc/nginx/snippets/laravel.conf; }

    # ── Laravel Reverb WebSocket (ws://host/app/{key}) ──────────────────────
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA static assets (hashed) ──────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── App updates (manifest + binaries) ──────────────────────────────────
    location ^~ /updates/ {
        root /var/www;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition "attachment";
    }

    # ── SPA fallback (client-side routing) ──────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ── Deny hidden files ───────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
